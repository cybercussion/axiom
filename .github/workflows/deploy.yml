name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Gates. Axiom is zero-build and the showcase deploys SOURCE, but a broken edit
      # must not reach the page: lint, the tool tests, and a throwaway build + dist
      # verification (the canonical fleet pipeline dogfoods itself here).
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests (tools + core)
        run: npm test
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Browser tests (Chromium, WebKit, Firefox — production CSP)
        run: |
          npx playwright install --with-deps chromium webkit firefox
          AXIOM_ENGINES=chromium,webkit,firefox npm run e2e
      - name: Build + verify dist + README weight claims
        run: npm run build && npm run verify-dist && node tools/weigh.js --check
      - name: PWA contract
        run: npm run check-pwa

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject Production Base Path
        # The showcase lives under /axiom/. Relative URLs follow the <base> tag, but
        # ABSOLUTE import-map addresses ("/src/...") resolve against the DOMAIN root and
        # 404 — every core module was failing to load from 2026-07-10 until this rewrite.
        # dist/ is not what deploys (zero-build thesis), so it is removed from the artifact.
        run: |
          sed -i 's|<base.*>|<base href="/axiom/">|g' index.html
          sed -i 's|"/src/|"/axiom/src/|g' index.html
          grep -q '"@state": "/axiom/src/core/state.js"' index.html
          # CSP: admit the REWRITTEN import map by hash (never 'unsafe-inline');
          # connect-src from the public runtime config. --check proves it current.
          node tools/csp.js index.html --write --config axiom-config.js
          node tools/csp.js index.html --check --config axiom-config.js
          rm -rf dist node_modules
          touch .nojekyll
          cp index.html 404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Zero-build project: the root directory IS the artifact
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
