<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Axiom</title>
  <base href="/">
  <!-- Public runtime config (window.AXIOM_CONFIG). A file, never inline: the
       deployed CSP admits 'self' scripts and the import map by hash, nothing else. -->
  <script src="axiom-config.js"></script>
  <script type="importmap">
    {
      "imports": {
        "@state": "/src/core/state.js",
        "@core/": "/src/core/",
        "@shared/": "/src/shared/",
        "@features/": "/src/features/"
      }
    }
  </script>

  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Import-map addresses MUST be absolute (leading slash), never relative
       ("./…"): relative addresses resolve against the current route URL and
       break the module graph on deploy — and the build resolves aliases to
       absolute paths anyway. Never hand-write module-preload hints here: the
       BUILD emits them (tools/minify.js emitModulePreload) for the startup graph,
       and refuses any module that still carries a bare specifier — a preloaded
       module can be resolved before this map registers (Cloudflare re-sends the
       hints as a Link: header), an intermittent "Failed to resolve module
       specifier" race that caches the failure per URL. -->

  <link rel="stylesheet" href="src/shared/styles/theme.css">
  <link rel="stylesheet" href="src/shared/styles/animations.css">
</head>

<body>
  <!-- Accessibility Announcer -->
  <div id="a11y-announcer" aria-live="polite" class="sr-only"></div>

  <nav-orchestrator id="nav-slot"></nav-orchestrator>

  <main id="app-container">
    <!-- Dynamic Content -->
  </main>

  <!-- Global Toasts -->
  <toast-manager></toast-manager>
  <route-progress></route-progress>

  <script type="module" src="src/shared/toast-manager.js"></script>
  <script type="module" src="src/shared/route-progress.js"></script>
  <script type="module" src="src/features/navigation/nav-orchestrator.js"></script>
  <script type="module" src="src/app.js"></script>
</body>

</html>
