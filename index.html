<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Axiom</title>
  <base href="/">
  <script type="importmap">
    {
      "imports": {
        "@state": "/src/core/state.js",
        "@core/": "/src/core/",
        "@shared/": "/src/shared/",
        "@features/": "/src/features/"
      }
    }
  </script>

  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Import-map addresses MUST be absolute (leading slash), never relative
       ("./…"): relative addresses resolve against the current route URL and
       break the module graph on deploy — and the build resolves aliases to
       absolute paths anyway. Module-preload hints are intentionally omitted — preloading the
       app entry makes the browser resolve its aliased (bare-specifier) imports
       BEFORE the inline import map registers, an intermittent "Failed to resolve
       module specifier" race. The app loads via its module <script> below, after
       the map is registered. Only add preload hints if the build first resolves
       aliases to absolute paths. -->

  <link rel="stylesheet" href="src/shared/styles/theme.css">
  <link rel="stylesheet" href="src/shared/styles/animations.css">
  <link rel="stylesheet" href="src/shared/styles/forms.css">
</head>

<body>
  <!-- Accessibility Announcer -->
  <div id="a11y-announcer" aria-live="polite" class="sr-only"></div>

  <nav-orchestrator id="nav-slot"></nav-orchestrator>

  <main id="app-container">
    <!-- Dynamic Content -->
  </main>

  <!-- Global Toasts -->
  <toast-manager></toast-manager>
  <route-progress></route-progress>

  <script type="module" src="src/shared/toast-manager.js"></script>
  <script type="module" src="src/shared/route-progress.js"></script>
  <script type="module" src="src/features/navigation/nav-orchestrator.js"></script>
  <script type="module" src="src/app.js"></script>
</body>

</html>
